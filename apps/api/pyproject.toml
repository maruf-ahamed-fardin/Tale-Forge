[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taleforge-api"
version = "0.1.0"
description = "FastAPI backend for TaleForge."
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.116,<1.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic[email]>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-jose[cryptography]>=3.4,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=25.0,<26.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
