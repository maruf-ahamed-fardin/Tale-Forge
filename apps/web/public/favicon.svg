<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e24"/>
      <stop offset="50%" stop-color="#1b1535"/>
      <stop offset="100%" stop-color="#090713"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Golden Quill Gradient -->
    <linearGradient id="goldQuill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Forge Fire Gradient -->
    <linearGradient id="forgeFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Book Pages Neon Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Anvil Gradient -->
    <linearGradient id="anvilMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="anvilHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Radial Ambient Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="6"/>

  <!-- Ambient Glow in Background -->
  <circle cx="256" cy="270" r="210" fill="url(#centerGlow)"/>

  <!-- Open Book Wings (Tale) -->
  <!-- Left Page Stack -->
  <path d="M256 315 C 210 300, 150 295, 95 305 L 95 185 C 150 175, 210 180, 256 198 Z" 
        fill="url(#bookCover)" stroke="#818cf8" stroke-width="3.5"/>
  <path d="M256 310 C 215 296, 158 292, 105 300 L 105 190 C 158 182, 215 186, 256 202 Z" 
        fill="#1e1b4b" stroke="url(#pageGlow)" stroke-width="2"/>
  <!-- Left Inner Lines -->
  <line x1="130" y1="218" x2="230" y2="228" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="125" y1="242" x2="225" y2="252" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="128" y1="266" x2="215" y2="276" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right Page Stack -->
  <path d="M256 315 C 302 300, 362 295, 417 305 L 417 185 C 362 175, 302 180, 256 198 Z" 
        fill="url(#bookCover)" stroke="#c084fc" stroke-width="3.5"/>
  <path d="M256 310 C 297 296, 354 292, 407 300 L 407 190 C 354 182, 297 186, 256 202 Z" 
        fill="#1e1b4b" stroke="url(#pageGlow)" stroke-width="2"/>
  <!-- Right Inner Lines -->
  <line x1="282" y1="228" x2="382" y2="218" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="287" y1="252" x2="387" y2="242" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="297" y1="276" x2="384" y2="266" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Anvil Base (Forge) -->
  <!-- Top Surface / Lip of Anvil -->
  <path d="M155 365 L 357 365 L 340 380 L 172 380 Z" fill="#64748b"/>
  <path d="M140 345 C 130 345, 120 348, 110 355 C 125 362, 140 365, 160 365 L 352 365 C 375 365, 395 360, 410 345 L 410 340 L 140 340 Z" 
        fill="url(#anvilHighlight)" opacity="0.95"/>
  <!-- Anvil Body & Horn -->
  <path d="M140 345 L 395 345 C 375 375, 335 385, 320 405 L 335 435 L 360 445 L 152 445 L 177 435 L 192 405 C 177 385, 145 375, 125 358 Z" 
        fill="url(#anvilMetal)" stroke="#818cf8" stroke-width="3"/>
  <!-- Anvil Foot Stand -->
  <path d="M142 445 L 370 445 L 380 460 L 132 460 Z" fill="#334155" stroke="url(#borderGlow)" stroke-width="2"/>

  <!-- Forge Flames rising between Anvil and Book -->
  <path d="M256 355 C 230 340, 220 310, 240 285 C 248 305, 258 315, 256 355 Z" fill="url(#forgeFlame)" filter="url(#glow)"/>
  <path d="M256 355 C 282 340, 292 310, 272 285 C 264 305, 254 315, 256 355 Z" fill="url(#forgeFlame)" filter="url(#glow)"/>
  <path d="M256 345 C 245 330, 242 305, 256 270 C 270 305, 267 330, 256 345 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- Golden Magical Feather Quill (Rising proudly through the center) -->
  <!-- Quill Nib -->
  <polygon points="256,340 250,305 262,305" fill="#fde047" stroke="#b45309" stroke-width="1.5"/>
  <line x1="256" y1="340" x2="256" y2="318" stroke="#78350f" stroke-width="1.5"/>
  
  <!-- Feather Shaft / Rachis -->
  <path d="M256 310 Q 256 200, 295 105" stroke="#fef08a" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#sparkleGlow)"/>

  <!-- Feather Vanes (Right Side) -->
  <path d="M256 300 Q 295 245, 345 195 C 330 190, 310 190, 285 200 C 320 160, 345 145, 355 125 C 335 128, 315 138, 295 152 C 325 120, 335 105, 325 85 C 300 95, 285 115, 275 140 Z" 
        fill="url(#goldQuill)" filter="url(#glow)"/>

  <!-- Feather Vanes (Left Side) -->
  <path d="M256 300 Q 235 250, 215 220 C 230 220, 245 225, 255 235 C 235 185, 220 170, 210 150 C 228 158, 242 170, 252 185 C 240 145, 235 130, 245 115 C 255 130, 262 150, 266 170 Z" 
        fill="url(#goldQuill)" filter="url(#glow)"/>

  <!-- Feather Detail Barb lines -->
  <path d="M260 270 Q 285 250, 315 235" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M268 230 Q 300 205, 330 180" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M278 180 Q 305 160, 330 135" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Cosmic Sparks & Stars (Creativity Embers) -->
  <!-- Top Star Sparkle -->
  <path d="M365 95 Q 365 115, 385 115 Q 365 115, 365 135 Q 365 115, 345 115 Q 365 115, 365 95 Z" 
        fill="#fef08a" filter="url(#sparkleGlow)"/>
  <!-- Left Star Sparkle -->
  <path d="M145 135 Q 145 150, 160 150 Q 145 150, 145 165 Q 145 150, 130 150 Q 145 150, 145 135 Z" 
        fill="#c084fc" filter="url(#sparkleGlow)"/>
  <!-- Middle Small Star -->
  <path d="M215 90 Q 215 100, 225 100 Q 215 100, 215 110 Q 215 100, 205 100 Q 215 100, 215 90 Z" 
        fill="#fde047" filter="url(#sparkleGlow)"/>
  <!-- Floating Ember Dots -->
  <circle cx="210" cy="275" r="4.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="310" cy="285" r="4" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="180" cy="210" r="3.5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="335" cy="245" r="4.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="385" cy="165" r="3" fill="#fde047" filter="url(#sparkleGlow)"/>
  <circle cx="270" cy="75" r="3.5" fill="#ffffff" filter="url(#sparkleGlow)"/>
  <circle cx="120" cy="330" r="3" fill="#fbbf24"/>
  <circle cx="395" cy="335" r="3.5" fill="#f59e0b"/>
</svg>
