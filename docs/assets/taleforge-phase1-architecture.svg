<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TaleForge Phase 1 Architecture</title>
  <desc id="desc">A visual diagram showing the TaleForge monorepo structure and planned runtime flow.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#312E81" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="headerGradient" x1="110" y1="66" x2="1290" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #FBFAF7; }
      .panel { fill: #FFFFFF; stroke: #E7E5E4; stroke-width: 1.5; filter: url(#softShadow); }
      .soft { fill: #F8F7F4; stroke: #E7E5E4; stroke-width: 1.5; }
      .title { font: 800 42px Inter, Segoe UI, Arial, sans-serif; fill: #1F1B2D; }
      .subtitle { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #57534E; }
      .section { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill: #292524; }
      .label { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #292524; }
      .small { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #57534E; }
      .mono { font: 600 14px Consolas, Cascadia Mono, monospace; fill: #44403C; }
      .chip { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #4338CA; }
      .line { stroke: #6D28D9; stroke-width: 2.5; marker-end: url(#arrow); }
      .thinLine { stroke: #A78BFA; stroke-width: 1.6; }
      .mutedLine { stroke: #D6D3D1; stroke-width: 1.5; }
      .iconText { font: 800 20px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="980"/>

  <rect x="70" y="48" width="1260" height="142" rx="24" fill="url(#headerGradient)" filter="url(#softShadow)"/>
  <text x="110" y="112" class="title" fill="#FFFFFF">TaleForge</text>
  <text x="110" y="151" class="subtitle" fill="#FDFCFB">Your Voice. New Stories.</text>
  <text x="1040" y="112" text-anchor="end" class="subtitle" fill="#FDFCFB">Phase 1 Foundation</text>
  <text x="1040" y="150" text-anchor="end" class="small" fill="#F5F3FF">Monorepo, config, docs, Docker skeleton, API health</text>

  <rect x="70" y="230" width="590" height="650" rx="18" class="panel"/>
  <text x="110" y="280" class="section">Monorepo Structure</text>
  <text x="110" y="309" class="small">Clear ownership boundaries before product features are added.</text>

  <rect x="110" y="345" width="500" height="80" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <circle cx="150" cy="385" r="22" fill="#4F46E5"/>
  <text x="150" y="392" text-anchor="middle" class="iconText">W</text>
  <text x="190" y="379" class="label">apps/web</text>
  <text x="190" y="403" class="small">Next.js frontend shell starts in Phase 2</text>

  <rect x="110" y="445" width="500" height="80" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <circle cx="150" cy="485" r="22" fill="#16A34A"/>
  <text x="150" y="492" text-anchor="middle" class="iconText">A</text>
  <text x="190" y="479" class="label">apps/api</text>
  <text x="190" y="503" class="small">FastAPI backend skeleton with health endpoints</text>

  <rect x="110" y="545" width="235" height="86" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <circle cx="143" cy="579" r="18" fill="#EA580C"/>
  <text x="143" y="586" text-anchor="middle" class="iconText">AI</text>
  <text x="175" y="575" class="label">ai</text>
  <text x="175" y="599" class="small">training, inference,</text>
  <text x="175" y="619" class="small">pipeline, evaluation</text>

  <rect x="375" y="545" width="235" height="86" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <circle cx="408" cy="579" r="18" fill="#DB2777"/>
  <text x="408" y="586" text-anchor="middle" class="iconText">C</text>
  <text x="440" y="575" class="label">configs</text>
  <text x="440" y="599" class="small">training.yaml and</text>
  <text x="440" y="619" class="small">generation.yaml</text>

  <rect x="110" y="656" width="235" height="86" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <circle cx="143" cy="690" r="18" fill="#0891B2"/>
  <text x="143" y="697" text-anchor="middle" class="iconText">D</text>
  <text x="175" y="686" class="label">data</text>
  <text x="175" y="710" class="small">raw, extracted,</text>
  <text x="175" y="730" class="small">processed, datasets</text>

  <rect x="375" y="656" width="235" height="86" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <circle cx="408" cy="690" r="18" fill="#7C3AED"/>
  <text x="408" y="697" text-anchor="middle" class="iconText">M</text>
  <text x="440" y="686" class="label">models</text>
  <text x="440" y="710" class="small">base, adapters,</text>
  <text x="440" y="730" class="small">checkpoints</text>

  <rect x="110" y="767" width="235" height="66" rx="14" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="137" y="795" class="label">outputs</text>
  <text x="137" y="818" class="small">generations and evaluations</text>

  <rect x="375" y="767" width="235" height="66" rx="14" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="402" y="795" class="label">docs + docker</text>
  <text x="402" y="818" class="small">setup guides and containers</text>

  <rect x="740" y="230" width="590" height="650" rx="18" class="panel"/>
  <text x="780" y="280" class="section">Planned Runtime Flow</text>
  <text x="780" y="309" class="small">Phase 1 creates the paths; later phases fill in the behavior.</text>

  <rect x="905" y="350" width="260" height="68" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="1035" y="378" text-anchor="middle" class="label">Browser</text>
  <text x="1035" y="400" text-anchor="middle" class="small">Responsive creative UI</text>

  <line x1="1035" y1="418" x2="1035" y2="466" class="line"/>

  <rect x="905" y="466" width="260" height="68" rx="14" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="1035" y="494" text-anchor="middle" class="label">Next.js Web App</text>
  <text x="1035" y="516" text-anchor="middle" class="small">Story studio, library, settings</text>

  <line x1="1035" y1="534" x2="1035" y2="582" class="line"/>

  <rect x="905" y="582" width="260" height="68" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="1035" y="610" text-anchor="middle" class="label">FastAPI Backend</text>
  <text x="1035" y="632" text-anchor="middle" class="small">REST API, auth, jobs, services</text>

  <line x1="904" y1="616" x2="825" y2="616" class="line"/>
  <line x1="1166" y1="616" x2="1245" y2="616" class="line"/>
  <line x1="1035" y1="650" x2="1035" y2="724" class="line"/>

  <rect x="760" y="584" width="120" height="64" rx="13" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="820" y="611" text-anchor="middle" class="label">Storage</text>
  <text x="820" y="633" text-anchor="middle" class="small">local now</text>

  <rect x="1190" y="584" width="120" height="64" rx="13" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="1250" y="611" text-anchor="middle" class="label">Postgres</text>
  <text x="1250" y="633" text-anchor="middle" class="small">Phase 3</text>

  <rect x="852" y="724" width="366" height="92" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="1035" y="754" text-anchor="middle" class="label">AI Provider Interface</text>
  <text x="1035" y="778" text-anchor="middle" class="small">Local Transformers first, more providers later</text>
  <text x="1035" y="800" text-anchor="middle" class="mono">base model + TaleForge adapter</text>

  <rect x="780" y="348" width="90" height="36" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="825" y="371" text-anchor="middle" class="chip">Phase 2</text>
  <rect x="780" y="464" width="90" height="36" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="825" y="487" text-anchor="middle" class="chip">Phase 2</text>
  <rect x="780" y="580" width="90" height="36" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="825" y="603" text-anchor="middle" class="chip">Phase 3</text>
  <rect x="1220" y="724" width="90" height="36" rx="18" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="1265" y="747" text-anchor="middle" class="chip">Later</text>

  <rect x="70" y="910" width="1260" height="34" rx="17" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1.5"/>
  <text x="700" y="932" text-anchor="middle" class="small">Phase 1 is intentionally small: structure, configuration, documentation, and a minimal API health check.</text>
</svg>
